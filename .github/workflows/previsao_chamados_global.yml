# ============================================================================
# Malha IA v4.0.8 — Workflow 2A: PREVISÃO GLOBAL DE CHAMADOS
# Roda 1×/dia às 06:30 UTC (03:30 BRT). Executa apenas os 8 modelos de
# contagem de chamados/mês + ensemble. Gera 14 abas PREVISAO_* sem sufixo.
# 12 horas antes do workflow de custos (previsao_custo_global.yml).
# Salvar em: .github/workflows/previsao_chamados_global.yml
# ============================================================================
name: 2A - Previsao Global Chamados (diario)

concurrency:
  group: malha-ia-previsao-chamados
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 6 * * *'     # 06:30 UTC = 03:30 BRT (diário)
  workflow_dispatch:

jobs:
  previsao_chamados:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r execucao_offline/requirements.txt

      - name: Reconstruir credenciais Google
        env:
          AUTENTICACAO_GOOGLE: ${{ secrets.AUTENTICACAO_GOOGLE }}
        run: |
          echo "$AUTENTICACAO_GOOGLE" | base64 -d > autenticacao_google.json
          echo "{}" > chaves_api.json

      - name: Executar previsao de chamados
        run: python motor_v36.py --apenas-previsao-chamados
