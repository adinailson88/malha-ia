# ============================================================================
# Malha IA v4.0.8 — Workflow 1: CLASSIFICAÇÃO
# Roda a cada 15 min, processa 1 lote (15 chamados) com BiLSTM, encerra.
# Módulo: motor_classificacao_v1.py
# ============================================================================
name: 1 - Classificacao (rapido)

concurrency:
  group: malha-ia-classificacao
  cancel-in-progress: false

on:
  # PAUSADO 2026-06-20: a classificacao passou a viver no repo classificacao-chamados
  # (bancada com validacao humana). O malha-ia agora importa o melhor modelo validado
  # via scripts/importar_classificacao_validada.py (workflow "Importar classificacao
  # validada"). Mantido workflow_dispatch para execucao manual pontual.
  # schedule:
  #   - cron: '*/15 * * * *'    # a cada 15 minutos
  workflow_dispatch:

jobs:
  classificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r execucao_offline/requirements.txt

      - name: Reconstruir credenciais Google
        env:
          AUTENTICACAO_GOOGLE: ${{ secrets.AUTENTICACAO_GOOGLE }}
        run: |
          echo "$AUTENTICACAO_GOOGLE" | base64 -d > autenticacao_google.json
          echo "{}" > chaves_api.json

      - name: Executar classificacao
        run: python motor_classificacao_v1.py --apenas-classificacao
