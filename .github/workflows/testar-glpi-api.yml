name: Testar API GLPI (somente leitura)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/testar-glpi-api.yml'

permissions:
  contents: read

jobs:
  testar-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testar autenticação e leitura GLPI
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
        run: python scripts/testar_glpi_api.py
