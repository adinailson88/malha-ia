name: Patch monitor status filter

on:
  push:
    paths:
      - '.github/workflows/patch-monitor-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard monitor status filter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          path = Path('dashboard_malha_ia_v36.html')
          raw = path.read_text(encoding='utf-8')
          usa_crlf = '\r\n' in raw
          text = raw.replace('\r\n', '\n')

          antigo_html = '''<div class="monitor-filter-options">
        <label><input type="checkbox" class="monitor-status-filter" value="Aberto" checked onchange="onFiltroStatusMonitor()"> Aberto</label>
        <label><input type="checkbox" class="monitor-status-filter" value="Em execução" checked onchange="onFiltroStatusMonitor()"> Em execução</label>
        <label><input type="checkbox" class="monitor-status-filter" value="Concluído" checked onchange="onFiltroStatusMonitor()"> Concluído</label>
        <label><input type="checkbox" class="monitor-status-filter" value="Cancelado" checked onchange="onFiltroStatusMonitor()"> Cancelado</label>
      </div>'''

          novo_html = '''<div class="monitor-filter-options" id="monitor-status-options">
        <span style="font-size:11px;color:var(--ufsb-cinza-medio);">Status carregados dinamicamente da aba CHAMADOS.</span>
      </div>'''

          if antigo_html not in text and novo_html not in text:
              raise SystemExit('Bloco HTML do filtro de status não encontrado.')
          text = text.replace(antigo_html, novo_html)

          antigo_const = '''const STATUS_MONITOR_OPCOES = ['Aberto', 'Em execução', 'Concluído', 'Cancelado'];
let statusMonitorSelecionados = new Set(STATUS_MONITOR_OPCOES);'''

          novo_const = '''let STATUS_MONITOR_OPCOES = [];
let statusMonitorSelecionados = new Set();
let statusMonitorInicializado = false;'''

          if antigo_const not in text and novo_const not in text:
              raise SystemExit('Constantes do filtro de status não encontradas.')
          text = text.replace(antigo_const, novo_const)

          marcador_funcoes = '''function obterStatusMonitorSelecionados() {
  const checks = Array.from(document.querySelectorAll('.monitor-status-filter'));
  if (!checks.length) return new Set(STATUS_MONITOR_OPCOES);
  const marcados = checks
    .filter(chk => chk.checked)
    .map(chk => chk.value);
  return new Set(marcados);
}'''

          novas_funcoes = '''function escapeHtmlBasico(valor) {
  return (valor === null || valor === undefined ? '' : valor.toString())
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function atualizarFiltrosStatusMonitor(linhasValidas) {
  const container = document.getElementById('monitor-status-options');
  if (!container) return;

  const statusEncontrados = Array.from(new Set(
    linhasValidas
      .map(linha => (linha[COL_STATUS] || '').toString().trim())
      .filter(Boolean)
  )).sort((a, b) => a.localeCompare(b, 'pt-BR'));

  const listaMudou = statusEncontrados.length !== STATUS_MONITOR_OPCOES.length ||
    statusEncontrados.some((status, idx) => status !== STATUS_MONITOR_OPCOES[idx]);

  if (!listaMudou) return;

  const statusAnteriores = new Set(STATUS_MONITOR_OPCOES);
  const selecaoAnterior = new Set(statusMonitorSelecionados);

  STATUS_MONITOR_OPCOES = statusEncontrados;

  if (!statusMonitorInicializado) {
    statusMonitorSelecionados = new Set(statusEncontrados);
  } else {
    statusMonitorSelecionados = new Set(
      statusEncontrados.filter(status => selecaoAnterior.has(status) || !statusAnteriores.has(status))
    );
  }
  statusMonitorInicializado = true;

  if (!statusEncontrados.length) {
    container.innerHTML = '<span style="font-size:11px;color:var(--ufsb-cinza-medio);">Nenhum status encontrado na aba CHAMADOS.</span>';
    return;
  }

  container.innerHTML = statusEncontrados.map(status => {
    const safe = escapeHtmlBasico(status);
    const checked = statusMonitorSelecionados.has(status) ? 'checked' : '';
    return `<label><input type="checkbox" class="monitor-status-filter" value="${safe}" ${checked} onchange="onFiltroStatusMonitor()"> ${safe}</label>`;
  }).join('');
}

function obterStatusMonitorSelecionados() {
  const checks = Array.from(document.querySelectorAll('.monitor-status-filter'));
  if (!checks.length) return new Set(STATUS_MONITOR_OPCOES);
  const marcados = checks
    .filter(chk => chk.checked)
    .map(chk => chk.value);
  return new Set(marcados);
}'''

          if 'function atualizarFiltrosStatusMonitor(linhasValidas)' not in text:
              if marcador_funcoes not in text:
                  raise SystemExit('Função obterStatusMonitorSelecionados não encontrada para inserção.')
              text = text.replace(marcador_funcoes, novas_funcoes)

          antigo_processar = '''function processarChamados() {
  if (!dadosChamados.length) return;
  statusMonitorSelecionados = obterStatusMonitorSelecionados();
  const linhasValidas = dadosChamados.slice(1).filter(linha => {
    const dataAbertura = (linha[COL_DATA_ABERTURA] || '').toString().trim();
    const status = (linha[COL_STATUS] || '').toString().trim();
    return dataAbertura !== '' && status !== '';
  });
  const linhas = linhasValidas.filter(linha => {
    const status = (linha[COL_STATUS] || '').toString().trim();
    return statusMonitorSelecionados.has(status);
  });'''

          novo_processar = '''function processarChamados() {
  if (!dadosChamados.length) return;
  const linhasValidas = dadosChamados.slice(1).filter(linha => {
    const dataAbertura = (linha[COL_DATA_ABERTURA] || '').toString().trim();
    const status = (linha[COL_STATUS] || '').toString().trim();
    return dataAbertura !== '' && status !== '';
  });
  atualizarFiltrosStatusMonitor(linhasValidas);
  statusMonitorSelecionados = obterStatusMonitorSelecionados();
  const linhas = linhasValidas.filter(linha => {
    const status = (linha[COL_STATUS] || '').toString().trim();
    return statusMonitorSelecionados.has(status);
  });'''

          if novo_processar not in text:
              if antigo_processar not in text:
                  raise SystemExit('Bloco inicial de processarChamados não encontrado.')
              text = text.replace(antigo_processar, novo_processar)

          saida = text.replace('\n', '\r\n') if usa_crlf else text
          path.write_text(saida, encoding='utf-8', newline='')

          html = path.read_text(encoding='utf-8')
          if 'monitor-status-options' not in html:
              raise SystemExit('Validação falhou: id monitor-status-options ausente.')
          if 'function atualizarFiltrosStatusMonitor(linhasValidas)' not in html:
              raise SystemExit('Validação falhou: função dinâmica de status ausente.')
          if "['Aberto', 'Em execução', 'Concluído', 'Cancelado']" in html:
              raise SystemExit('Validação falhou: lista fixa antiga ainda presente.')

          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          for idx, script in enumerate(scripts):
              tmp = Path(f'/tmp/malha_script_{idx}.js')
              tmp.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(tmp)], check=True)

          print('Patch aplicado e sintaxe JavaScript validada.')
          PY

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-monitor-status.yml

      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_malha_ia_v36.html .github/workflows/patch-monitor-status.yml
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
          else
            git commit -m "Corrige filtro de status do monitor"
            git push
          fi
