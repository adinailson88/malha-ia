# ============================================================================
# Malha IA — Deploy automático no GitHub Pages
# Roda sempre que um HTML é alterado no main. Publica todos os dashboards.
# URL base: https://adinailson88.github.io/malha-ia/
# ============================================================================
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'dados/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Atualizar dados JSON"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar arquivos HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
